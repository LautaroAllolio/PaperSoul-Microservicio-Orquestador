# Stack local versionado para probar el flujo E2E. Agrega los downstream de los
# colegas sin modificar sus repos: solo referencia imágenes ya construidas.
#
# Las tres imágenes se referencian por versión concreta; no se usa `:latest`.
# Construir/etiquetar una vez (cada repo define su propia versión):
#   docker build -t pdfextractor:v1.0.0 ../PaperSoul-Microservicio-Extractor
#   docker build -t papersoul-persistencia:v1.0.0 ../PaperSoul-Microservicio-Persistencia
#
# Uso (combina con el compose base, que define la red `mired`):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Consul y MongoDB se levantan por separado desde sus propios stacks. Persistencia
# necesita un MongoDB accesible: definir MONGODB_URI apuntando al MongoDB levantado.
services:
  extractor:
    image: ${EXTRACTOR_IMAGE:?Definí EXTRACTOR_IMAGE con una versión concreta (p. ej. pdfextractor:v1.0.0)}
    restart: unless-stopped
    deploy:
      replicas: 3
    environment:
      PDFEXTRACTOR_PORT: "9000"
      PDFEXTRACTOR_MIN_TEXT_LENGTH: "0"
      # Registro en Consul (el agente vive en la red `mired`): la instancia
      # anuncia su IP y un check GET /health; Traefik arma el router con tags.
      PDFEXTRACTOR_CONSUL_ENABLED: "true"
      PDFEXTRACTOR_CONSUL_HTTP_ADDR: http://consul:8500
    networks:
      - mired

  persistencia:
    image: ${PERSISTENCIA_IMAGE:?Definí PERSISTENCIA_IMAGE con una versión concreta (p. ej. papersoul-persistencia:v1.0.0)}
    restart: unless-stopped
    deploy:
      replicas: 3
    environment:
      MONGODB_URI: ${MONGODB_URI:?Defina MONGODB_URI apuntando a su Mongo con auth (p. ej. mongodb://root:CLAVE@mongodb:27017/papersoul?authSource=admin)}
    networks:
      - mired
