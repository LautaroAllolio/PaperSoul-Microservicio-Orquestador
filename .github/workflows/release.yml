name: Release

# Publica la imagen versionada en GHCR. Se dispara solo con tags semánticos
# (v1.2.3), no en cada push: `ci.yml` sigue validando main y los PR.
on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Suite completa
        run: make ci

  image:
    name: Publicar imagen
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # GHCR exige nombres en minúsculas; el owner del repo puede tener mayúsculas.
      - name: Resolver nombre de la imagen
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Genera los tags del release: 1.2.3, v1.2.3, 1.2, sha-<corto>.
      # El prefijo `v` se conserva para que el tag de la imagen coincida con el
      # tag de Git que disparó el workflow.
      - name: Metadatos
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=PaperSoul Orquestador
            org.opencontainers.image.description=Orquestador y validador de PDFs de PaperSoul

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
