# Compose del Orquestador. Define ÚNICAMENTE recursos propios del Orquestador:
# no incluye Traefik ni los downstream (Extractor/Persistencia), que se
# despliegan por separado y se alcanzan a través de la red externa `mired`.
#
# No publica el puerto 8080 al host (lo expone Traefik dentro de `mired`) y no
# fija `container_name`, así que se pueden levantar varias réplicas.
# La imagen se construye aparte (docker build) y se referencia aquí con
# ORCH_IMAGE, de modo que se puedan desplegar distintas versiones.
name: papersoul-orchestrator

services:
  orchestrator:
    image: ${ORCH_IMAGE:-papersoul-orchestrator:local}
    restart: unless-stopped
    environment:
      ORCH_ADDR: ${ORCH_ADDR:-:8080}
      ORCH_MAX_FILE_SIZE: ${ORCH_MAX_FILE_SIZE:-26214400}
      ORCH_VALIDATION_RELAXED: ${ORCH_VALIDATION_RELAXED:-true}
      ORCH_MAX_CONCURRENCY: ${ORCH_MAX_CONCURRENCY:-8}
      EXTRACTOR_URL: ${EXTRACTOR_URL:?defina EXTRACTOR_URL (p. ej. http://extractor:9000)}
      EXTRACTOR_TIMEOUT: ${EXTRACTOR_TIMEOUT:-30s}
      PERSISTENCE_URL: ${PERSISTENCE_URL:?defina PERSISTENCE_URL (p. ej. http://persistencia:8000)}
      PERSISTENCE_TIMEOUT: ${PERSISTENCE_TIMEOUT:-15s}
      ORCH_SHUTDOWN_TIMEOUT: ${ORCH_SHUTDOWN_TIMEOUT:-10s}
    # Margen mayor que ORCH_SHUTDOWN_TIMEOUT para que el cierre graceful termine.
    stop_grace_period: ${ORCH_STOP_GRACE_PERIOD:-15s}
    deploy:
      replicas: ${ORCH_REPLICAS:-2}
    networks:
      - mired
    # Descubrimiento de las réplicas por el Docker provider de la instancia Traefik
    # existente. Labels del servicio (shared por todas las réplicas): un único router
    # y un único servicio con balanceo y healthcheck, por eso NO fijamos container_name.
    # La instancia Traefik usa exposedByDefault=false en su traefik.yml: sin
    # traefik.enable=true el contenedor quedaría invisible para el proxy.
    labels:
      - "traefik.enable=true"
      # IP a usar dentro de la red compartida (Traefik vive en `mired`).
      - "traefik.docker.network=mired"
      # La API es HTTP/TCP (sin UDP). El router va por https: el entrypoint http
      # (:80) del Traefik existente redirige globalmente a https.
      - "traefik.http.routers.orchestrator.entrypoints=https"
      # Host cubierto por el certificado estático (wildcard *.universidad.localhost)
      # y path exacto del endpoint (así la app conserva sus 404/405/502 nativos).
      - "traefik.http.routers.orchestrator.rule=Host(`orquestador.universidad.localhost`) && Path(`/api/v1/documents/process`)"
      # Sin certresolver (el Traefik existente usa cert.pem/key.pem estáticos): solo
      # se marca TLS para que el entrypoint https sirva el certificado del default TLS store.
      - "traefik.http.routers.orchestrator.tls=true"
      - "traefik.http.routers.orchestrator.middlewares=orchestrator-retry"
      # Las réplicas comparten este nombre de servicio: Traefik las agrupa y balancea.
      - "traefik.http.services.orchestrator.loadbalancer.server.port=8080"
      # Health check del balanceador = liveness GET /health (aislado de downstream).
      - "traefik.http.services.orchestrator.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.orchestrator.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.orchestrator.loadbalancer.healthcheck.timeout=3s"
      # Retry limitado a lo que ofrece Traefik v3.5: reintenta solo cuando el backend
      # no responde (error de conexión/sin respuesta). v3.5 NO reintenta respuestas
      # 5xx (status) ni POST con cuerpo (retryNonIdempotentMethod); por eso esto NO
      # es una garantía de reejecución en otra instancia.
      - "traefik.http.middlewares.orchestrator-retry.retry.attempts=2"
      - "traefik.http.middlewares.orchestrator-retry.retry.initialinterval=500ms"
    # Sin `ports:` (no se publica al host) y sin `container_name` (permite escalar).

networks:
  # Red del stack de Traefik: administrada fuera de este Compose. No se crea ni
  # se elimina aquí; debe existir antes de `docker compose up`.
  mired:
    external: true
    name: ${TRAEFIK_NETWORK:-mired}
