# Compose del Orquestador. Define ÚNICAMENTE recursos propios del Orquestador:
# no incluye Traefik ni los downstream (Extractor/Persistencia), que se
# despliegan por separado y se alcanzan a través de la red externa `mired`.
#
# No publica el puerto 8080 al host (lo expone Traefik dentro de `mired`) y no
# fija `container_name`, así que se pueden levantar varias réplicas.
# La imagen se construye/publica aparte (make docker-build / CI) y se referencia
# aquí con ORCH_IMAGE. No hay `build:` ni tags flotantes: cada despliegue usa una
# versión concreta (idealmente por digest en producción).
name: papersoul-orchestrator

services:
  orchestrator:
    # Sin default `:local`: si falta ORCH_IMAGE, Compose falla con un mensaje
    # explícito en vez de arrancar una imagen vieja sin darse cuenta.
    image: ${ORCH_IMAGE:?Definí ORCH_IMAGE con una imagen versionada (p. ej. ghcr.io/lautaroallolio/papersoul-microservicio-orquestador:v0.1.0)}
    restart: unless-stopped
    environment:
      ORCH_ADDR: ${ORCH_ADDR:-:8080}
      ORCH_MAX_FILE_SIZE: ${ORCH_MAX_FILE_SIZE:-26214400}
      ORCH_VALIDATION_RELAXED: ${ORCH_VALIDATION_RELAXED:-true}
      ORCH_MAX_CONCURRENCY: ${ORCH_MAX_CONCURRENCY:-8}
      # Descubrimiento: `consul` (los Compose) o `static` (desarrollo sin Consul).
      # En `consul` las URLs fijas de abajo no se usan y pueden quedar vacías.
      DISCOVERY: ${DISCOVERY:-consul}
      CONSUL_HTTP_ADDR: ${CONSUL_HTTP_ADDR:-http://consul:8500}
      # Solo para contenedores con varias redes: fuerza la IP que se anuncia en
      # Consul (si se omite, se autodetecta la primera IPv4 no loopback).
      ORCH_ADVERTISE_ADDR: ${ORCH_ADVERTISE_ADDR:-}
      # Solo se usan con DISCOVERY=static; en modo consul quedan vacías.
      EXTRACTOR_URL: ${EXTRACTOR_URL:-}
      EXTRACTOR_TIMEOUT: ${EXTRACTOR_TIMEOUT:-30s}
      PERSISTENCE_URL: ${PERSISTENCE_URL:-}
      PERSISTENCE_TIMEOUT: ${PERSISTENCE_TIMEOUT:-15s}
      ORCH_SHUTDOWN_TIMEOUT: ${ORCH_SHUTDOWN_TIMEOUT:-10s}
    # Margen mayor que ORCH_SHUTDOWN_TIMEOUT para que el cierre graceful termine.
    stop_grace_period: ${ORCH_STOP_GRACE_PERIOD:-15s}
    deploy:
      replicas: ${ORCH_REPLICAS:-2}
    networks:
      - mired
    # Sin labels de Traefik: el ruteo viaja como tags del registro en Consul
    # (traefik.enable=true incluida). La instancia Traefik usa Consul Catalog con
    # exposedByDefault=false, así que solo descubre lo que se registra en Consul.
    # El Docker provider sigue activo para la UI de Consul, no para esta app.
    # Sin `ports:` (no se publica al host) y sin `container_name` (permite escalar).

networks:
  # Red del stack de Traefik: administrada fuera de este Compose. No se crea ni
  # se elimina aquí; debe existir antes de `docker compose up`.
  mired:
    external: true
    name: ${TRAEFIK_NETWORK:-mired}
